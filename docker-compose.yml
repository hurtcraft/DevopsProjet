services:

  mysql:
    image: mysql:8

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tododb

    ports:
      - "3307:3306"

  todo-service:
    build: ./todoService

    ports:
      - "8081:8080"

    depends_on:
      - mysql
      - notification-service

  notification-service:
    build: ./notificationService

    ports:
      - "8082:8082"