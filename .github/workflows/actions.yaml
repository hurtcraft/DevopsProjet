name: actions.yaml

on:
  push:
    branches: [ "master" ]
  pull_request:

jobs:
  test-todo-service:
    name: Test Todo Service
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: todoService

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Run tests
        run: mvn clean test


  test-notification-service:
    name: Test Notification Service
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: notificationService

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Run tests
        run: mvn clean test